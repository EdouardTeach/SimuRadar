name: Publier les applications de bureau

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Compiler sur ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            args: --win nsis portable
          - os: ubuntu-latest
            platform: linux
            args: --linux AppImage deb
          - os: macos-latest
            platform: mac
            args: --mac dmg zip --x64 --arm64
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer les dépendances
        run: npm ci
      - name: Compiler les paquets
        run: npx electron-builder ${{ matrix.args }} --publish never
      - name: Conserver les fichiers de publication
        uses: actions/upload-artifact@v4
        with:
          name: simuradar-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attacher les paquets à la Release GitHub
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger tous les paquets
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Publier la Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
